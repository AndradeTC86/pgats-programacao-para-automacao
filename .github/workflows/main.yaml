name: 'PGATS - Integração Contínua para Automação de Testes'

on:
  # Disparo manual
  workflow_dispatch:

  # Disparo agendado para rodar todo dia 
  schedule:
    - cron: '0 * * * *'

  # Disparo a partir de push
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest    
    steps:     
      - uses: actions/checkout@v4
    
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Instalando dependências
        run: npm install

      - name: Executando os testes unitários
        run: npm test      

      - name: Configurando GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:            
          path: ./mochawesome-report

      - name: Deploy to GitHub Pages        
        uses: actions/deploy-pages@v5