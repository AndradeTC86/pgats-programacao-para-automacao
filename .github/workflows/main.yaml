name: 'PGATS - Integração Contínua para Automação de Testes'

on:
  # Disparo manual
  workflow_dispatch:

  # Disparo agendado para rodar todo dia 
  schedule:
    - cron: '0 * * * *'

  # Disparo a partir de push
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:     
      - uses: actions/checkout@v4
    
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Instalando dependências
        run: npm install

      - name: Executando os testes unitários
        run: npm test

      - name: Renomear arquivo de relatório
        run: mv ./mochawesome-report/mochawesome.html ./mochawesome-report/index.html

      - name: Publish Report
        uses: peaceiris/actions-gh-pages@v3
        with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./mochawesome-report